[package]
name = "qqmusic-dl"
version = "0.1.0"
edition = "2021"
description = "QQ音乐下载器：匿名镜像 / 票据桥 / 扫码登录"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Hotsteel2901/qm-dl-RS"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
indicatif = "0.17"
qrcode = "0.14.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
rqrr = "0.11.0"
serde_json = "1.0"
unicode-width = "0.2"

[profile.release]
lto = true
strip = true
opt-level = 2
