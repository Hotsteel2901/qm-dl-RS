[package]
name = "qqmusic-dl"
version = "0.1.0"
edition = "2021"
description = "QQ音乐下载器：匿名镜像 / 票据桥 / 扫码登录"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Hotsteel2901/qm-dl-RS"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
console = "0.15"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
indicatif = "0.17"
libc = "0.2"
qrcode = "0.14.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
rqrr = "0.11.0"
rumqttc = { version = "0.25.1", default-features = false, features = ["proxy", "use-rustls-no-provider", "websocket"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0"
unicode-width = "0.2"
webpki-roots = "1.0"

[profile.release]
lto = true
strip = true
opt-level = 2
